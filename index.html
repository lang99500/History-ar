<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1">
    <title>历史照片AR展示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; overflow: hidden; font-family: "Microsoft Yahei", sans-serif; }
        .tip {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
        }
    </style>
    <!-- 引用本地vendor文件 -->
    <script src="vendor/three.min.js"></script>
    <script src="vendor/ar.js"></script>
    <script src="vendor/ar-threex.js"></script>
</head>
<body>
    <div class="tip">请扫描AR标记，查看历史照片</div>

    <script>
        // 初始化AR场景
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const scene = new THREE.Scene();

        // 初始化AR摄像头源
        const arToolkitSource = new THREEx.ArToolkitSource({ sourceType: 'webcam' });
        arToolkitSource.init(() => setTimeout(() => onResize(), 200));

        // 窗口大小适配
        function onResize() {
            arToolkitSource.onResizeElement();
            arToolkitSource.copyElementSizeTo(renderer.domElement);
            if (arToolkitContext.arController) {
                arToolkitSource.copyElementSizeTo(arToolkitContext.arController.canvas);
            }
        }
        window.addEventListener('resize', onResize);

        // 初始化AR上下文（加载本地相机标定文件）
        const arToolkitContext = new THREEx.ArToolkitContext({
            cameraParametersUrl: 'vendor/camera_para.dat',
            detectionMode: 'mono',
            maxDetectionRate: 60,
            canvasWidth: 1280,
            canvasHeight: 720
        });
        arToolkitContext.init(() => camera.projectionMatrix.copy(arToolkitContext.getProjectionMatrix()));

        // 加载35张历史照片，绑定对应AR标记
        const markerRoots = [];
        for (let i = 1; i <= 35; i++) {
            // 创建标记根节点
            const markerRoot = new THREE.Group();
            scene.add(markerRoot);
            // 绑定AR标记（编号1-35对应img1-img35）
            new THREEx.ArMarkerControls(arToolkitContext, markerRoot, {
                type: 'barcode',
                barcodeValue: i
            });

            // 创建图片平面
            const geometry = new THREE.PlaneGeometry(2, 1.5);
            // 加载对应图片
            const texture = new THREE.TextureLoader().load(`img${i}.jpg`);
            const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const mesh = new THREE.Mesh(geometry, material);
            // 调整图片角度，适配AR视角
            mesh.rotation.x = -Math.PI / 2;
            markerRoot.add(mesh);

            markerRoots.push(markerRoot);
        }

        // 动画循环，更新AR识别
        function animate() {
            requestAnimationFrame(animate);
            if (arToolkitSource.ready) {
                arToolkitContext.update(arToolkitSource.domElement);
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
